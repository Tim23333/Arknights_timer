<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>表格列宽回归测试（合成数据，非游戏数据）</title>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="./regression.css">
<body class="regression-page">
<h1>表格列宽回归测试</h1>
<p>独立合成数据，不连接游戏或后端；反复切换短值、长值、空行和重新出现的行。</p>
<button id="run">运行列宽稳定性测试</button>
<button id="fit">手动自适应</button>
<button id="fit-one">运行单列双击回归测试</button>
<div class="table-scroll regression-table">
<table class="data-table" id="sample"><thead><tr><th>名称</th><th>血量</th><th>下一动作预测</th></tr></thead><tbody><tr><td>敌人</td><td>1/1</td><td>移动</td></tr></tbody></table>
</div>
<pre id="result" role="status">等待测试</pre>
<script type="module" src="./tableLayoutRegression.mjs"></script>
</body>
</html>
