<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Timeline · 独立实时日志</title><link rel="stylesheet" href="/styles.css">
  <script type="module" src="/logWindow.mjs"></script>
</head>
<body>
  <div class="clock-drawer is-open is-pinned"><div class="clock-drawer-panel">
    <div class="clock-drawer-readout"><span class="clock-drawer-title">游戏时钟<small id="clock-source">等待主工作台共享时钟</small></span><strong id="clock-time">—</strong><span id="clock-frame">逻辑帧 —</span></div>
  </div></div>
  <main class="content">
    <div class="service-warning" id="transport-status" role="status">正在等待主工作台共享时钟…</div>
    <section class="page active" id="page-logs">
      <div class="page-heading"><h1>实时日志</h1><span id="log-mode">正在连接日志服务…</span></div>
      <div class="module-toolbar log-toolbar">
        <a class="button" href="/" target="_blank" rel="noopener">打开主工作台</a>
        <button class="button" data-log-command="logs-export" data-format="text">导出完整日志</button>
        <button class="button" data-log-command="logs-export" data-format="zip">一键打包诊断 ZIP</button>
        <button class="button" data-log-command="logs-environment">刷新环境信息</button>
        <button class="button" data-log-command="logs-folder">打开日志目录</button>
        <button class="button quiet" id="logs-clear">清空显示</button>
      </div>
      <div class="module-subbar"><label class="check"><input id="logs-paused" type="checkbox">暂停显示</label><label class="check"><input id="logs-follow" type="checkbox" checked>跟随最新</label><label>搜索<input id="logs-search" type="search" placeholder="日志内容 / 模块 / 异常"></label></div>
      <p class="log-path" id="log-path"></p><p id="log-task-status" role="status">网页缓存最近 10000 行；导出包含本次运行的完整落盘日志。</p>
      <div class="log-export" id="logs-export" hidden>
        <a class="button primary log-download" id="logs-download" aria-describedby="logs-download-hint">下载导出副本</a>
        <span class="log-export-note" id="logs-download-hint">下载位置由浏览器设置决定，日志目录中的原文件仍会保留。</span>
      </div>
      <div class="table-shell"><div class="table-scroll log-scroll"><table class="data-table log-table" id="log-table"><thead><tr><th>序号</th><th>日志</th></tr></thead><tbody><tr><td colspan="2">正在读取日志…</td></tr></tbody></table></div></div>
    </section>
  </main>
  <aside class="toast-stack" id="toast-stack" aria-live="polite" aria-label="操作提示"></aside>
</body>
</html>
